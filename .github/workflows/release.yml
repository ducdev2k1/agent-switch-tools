name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  # Create draft release first so all platform builds can upload in parallel
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($CONF_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Claude Tools ${GITHUB_REF_NAME#v}" \
            --notes "See the assets to download and install this version."

  # Build and upload for non-Windows platforms
  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-14
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Claude Tools v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Windows: build, optionally sign via SignPath, then upload to release
  release-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      id-token: write  # Required for SignPath OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-windows-latest

      - name: Install frontend dependencies
        run: pnpm install

      # Build and upload to draft release (handles latest.json + updater .sig files)
      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Claude Tools v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false

      # Sign Windows binaries via SignPath PowerShell module (works with free trial plan)
      - name: Sign via SignPath
        id: sign
        continue-on-error: true
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser -AllowClobber
          New-Item -ItemType Directory -Force -Path "signed-artifacts" | Out-Null

          # Sign NSIS exe installer
          $exeFiles = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $exeFiles) {
            Write-Host "Signing: $($file.Name)"
            Submit-SigningRequest `
              -InputArtifactPath $file.FullName `
              -ApiToken $env:SIGNPATH_API_TOKEN `
              -OrganizationId $env:SIGNPATH_ORG_ID `
              -ProjectSlug $env:SIGNPATH_PROJECT_SLUG `
              -SigningPolicySlug $env:SIGNPATH_POLICY_SLUG `
              -ArtifactConfigurationSlug "initial" `
              -OutputArtifactPath "signed-artifacts/$($file.Name)" `
              -WaitForCompletion
          }

      # Replace unsigned installers with signed versions on the release
      - name: Upload signed artifacts to release
        if: steps.sign.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find signed-artifacts -type f \( -name "*.exe" -o -name "*.msi" \) | while read file; do
            echo "Uploading signed: $file"
            gh release upload "${{ github.ref_name }}" "$file" --clobber
          done

  notify:
    needs: [create-release, release, release-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          if [ "${{ needs.release.result }}" = "success" ] && [ "${{ needs.release-windows.result }}" = "success" ]; then
            TEXT="✅ Release <b>${{ github.ref_name }}</b> thành công!%0A%0ARepository: <a href='https://github.com/${{ github.repository }}'>${{ github.repository }}</a>%0ACommit: <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>${{ github.sha }}</a>%0AWorkflow Run: <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>#${{ github.run_id }}</a>"
          else
            TEXT="❌ Release <b>${{ github.ref_name }}</b> thất bại!%0A%0ARepository: <a href='https://github.com/${{ github.repository }}'>${{ github.repository }}</a>%0ACommit: <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>${{ github.sha }}</a>%0AWorkflow Run: <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>#${{ github.run_id }}</a>"
          fi
          curl -s -X POST https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d parse_mode=HTML \
            -d text="$TEXT"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
